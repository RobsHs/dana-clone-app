# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx3072m -XX:+UseG1GC -Dfile.encoding=UTF-8

# AndroidX configuration
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin configuration
kotlin.code.style=official

# Network timeouts, keepalive, and retry configuration (prevents 504 Gateway Timeouts)
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.max.tentatives=10
systemProp.http.keepAlive=false

# CI stability flags
org.gradle.vfs.watch=false
